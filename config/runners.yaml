# ============================================================================
#  runners.yaml  —  which runners exist and are enabled. Each row's `plugin:`
#  dotted path ("package.module:ClassName") is imported by the registry, so
#  adding a runner = add a row here + an importable package; the orchestrator
#  core never changes. A broken `plugin:` fails loudly, naming the row.
#
#  default_image:  overrides the runner's image (a key into
#                  pins.yaml:base_images); null = host-side, no container.
#  Omit `plugin:`  to merely enable/disable a runner shipped via the
#                  `reprobe.runners` entry-point group instead.
# ============================================================================

runners:
  - id: python
    plugin: "reprobe.runners.python_script:PythonScriptRunner"
    default_image: python        # -> pins.yaml base_images.python
    enabled: true

  - id: jupyter
    plugin: "reprobe.runners.jupyter:JupyterRunner"
    default_image: python
    enabled: true

  - id: r
    plugin: "reprobe.runners.r_script:RScriptRunner"
    default_image: r
    enabled: true

  - id: rmarkdown
    plugin: "reprobe.runners.rmarkdown:RMarkdownRunner"
    default_image: r
    enabled: true

  - id: unity
    plugin: "reprobe.runners.unity:UnityRunner"
    default_image: null          # T0 structural runs host-side; no container
    enabled: true
    tier: structural             # informational only — T0 structural is the sole
                                 # tier this build implements (docs/DESIGN.md §5)
