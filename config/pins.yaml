# ============================================================================
#  pins.yaml  —  THE ONE FILE A FUTURE CHAIR EDITS.
#  Bump versions/digests here each year; you should never need to touch src/.
#  Everything pinned is recorded in every report so old reports reproduce later.
#  Run `reprobe doctor` after any change to confirm the harness still works.
# ============================================================================

year: 2026
# Bump on every republish — a tag must never be reused for different bytes, or
# reports that pin "<year>.<revision>" stop meaning one thing. Revision 2 adds
# the base-r compiler toolchain + preinstalled stats stack; revision 3 adds the
# dataset readers (pyarrow/openpyxl/pytables/...) that base-py was missing;
# revision 4 adds CPU-only pytorch + torchvision to base-py (see CHANGELOG);
# revision 5 republishes after 2026.4's platform manifests were deleted from
# GHCR and the tag became unpullable (built by .github/workflows/build-base-images.yml
# — never delete untagged versions); base-py's lock is unchanged, base-r's adds
# papermill for R-kernel notebooks with every package already locked held
# exactly (images/lock-add.py).
revision: 5                       # base-image tag becomes "<year>.<revision>"

base_images:
  # The immutable build base, pinned to its multi-arch index digest (Docker Hub),
  # so a rebuild from the committed locks starts from the same bytes.
  micromamba_base: "mambaorg/micromamba:1.5.10-noble@sha256:a0a4da2d5315f0d5b9d98196f2e9ecf50152c750bed4023bb127baade7e8faca"
  python:     "ghcr.io/m-colley/reprobe-base-py:2026.5"   # built by images/build-images.sh
  r:          "ghcr.io/m-colley/reprobe-base-r:2026.5"
  controller: "ghcr.io/m-colley/reprobe-controller:2026.5"

# The bytes each published tag must be. Runs use "<tag>@<digest>", so docker runs
# exactly these images even if a tag were ever overwritten. Keyed by the FULL tag:
# after a republish under a new tag an old entry no longer applies, so it can
# never pin a new tag to old bytes. build-base-images prints these lines after it
# publishes. A locally built image is not these bytes — remove its entry to use it.
base_image_digests:
  "ghcr.io/m-colley/reprobe-base-py:2026.5": "sha256:39522da7f383c6d7b30548282eb9249fc4162e76982158fa93ffde1941d6f738"
  "ghcr.io/m-colley/reprobe-base-r:2026.5": "sha256:ac0b977ee1455d54f9ad1f81ebb1c29a260b6f026c1a0ae7bf11e6c307b43a41"
  "ghcr.io/m-colley/reprobe-controller:2026.5": "sha256:727f93ce6ad055375702671c111ec58b2fe864e2c20be9c5d613cd941846cd4c"

llm:
  enabled: true
  provider: ollama
  endpoint: "http://127.0.0.1:11434"
  # Ollama runtime used by deploy/docker-compose.yml (keep its default in sync —
  # tests/unit/test_pins_sync.py enforces it). The runtime must be new enough
  # for `model`: Gemma 4 needs Ollama >= 0.20, and the 0.12.5 pinned before
  # this one could not pull it at all, so the LLM was always unavailable.
  # Digest is the multi-arch index from Docker Hub, so the tag cannot move.
  ollama_image: "ollama/ollama:0.33.3@sha256:32931b46719f673c05fdbaa81ccb26da18ea4a1c57590a754874ab28ba269eb2"
  model: "gemma4:e4b"              # Gemma 4 e4b (effective-4B edge build) — offline via Ollama, CPU-OK
  keep_alive: "10m"
  # Read timeout per LLM call (connect is capped at 5s in code). With stream=false
  # this effectively caps generation time, but it is not a strict wall-clock bound.
  timeout_s: 60
  # Advice below this is stamped meets_threshold: false in the report ("shown for
  # transparency only, never applied"). Advice is never auto-applied either way.
  confidence_threshold: 0.6

r:
  # Pinned CRAN snapshot for reproducible install.packages() of packages that
  # authors' R code needs but the base-r image doesn't ship. A dated Posit Public
  # Package Manager snapshot freezes package versions so a run reproduces
  # year-over-year (like the pinned base images). Empty -> live CRAN mirror
  # (cloud.r-project.org), which the report flags as non-reproducible.
  #
  # The `__linux__/<codename>/` segment is what makes P3M serve PRECOMPILED
  # binaries; without it the same snapshot returns source tarballs and every
  # artifact rebuilds its whole dependency tree. Observed 2026-08-13 on
  # roads-chi25-data: 26 packages including brms/rstan/lme4 compiling from
  # source blew the entire 2-hour install budget and the run was reported
  # infra-error. The codename MUST match base_images.r (Ubuntu 24.04 = noble);
  # if that image moves to a new Ubuntu, move this with it. A package with no
  # binary for the platform still falls back to source, so this is a speed
  # change, not a coverage one.
  cran_snapshot: "https://packagemanager.posit.co/cran/__linux__/noble/2026-07-23"

install:
  # Conda channels an artifact's environment.yml may use. Any other channel is
  # dropped and reported: a bare name on anaconda.org is an arbitrary user's
  # packages, and conda runs their post-link scripts in the install phase, which
  # has network access. `defaults` is allowed but flagged for Anaconda's terms.
  conda_channels: [conda-forge, bioconda, pytorch, nvidia, defaults]

tools:
  repo2docker: "jupyter-repo2docker==2024.07.0"   # opt-in fallback builder only

unity:
  image_repo: "unityci/editor"
  default_image_version: "3"      # GameCI image-tag suffix
  modules: ["linux-il2cpp"]
  # Digest-pinned tag map; a future `reprobe unity-refresh` (Phase 3, not yet
  # implemented) will refresh it. Leave empty until then.
  known_tags: {}

fetch:
  # Used ONLY for the sandbox smoke test (`reprobe doctor --smoke`); not a runtime.
  smoke_image: "hello-world"
  # Generic image for repos when a base image isn't built yet (best-effort).
  fallback_python_image: "python:3.13-slim"
  # Institutional hosts the built-in fetchers should also accept — the fix for
  # "no fetcher matched" without touching src/ (see chair runbook).
  extra_git_hosts: []               # e.g. [gitlab.lrz.de]
  dataverse_hosts: []               # installs whose hostname lacks "dataverse", e.g. [darus.uni-stuttgart.de]
