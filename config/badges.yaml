# ============================================================================
#  badges.yaml  —  declarative badge decision rules. Tuning thresholds is a
#  config change, not a code change. The reporter (report/badges.py) reads this.
#
#  Stance: the harness GRANTS only "Available" automatically; it PROPOSES
#  "Functional" as a candidate for a human; it never auto-grants anything
#  deeper. Over-claiming is the cardinal sin of an automated repro checker.
# ============================================================================

acm:
  available:
    # Granted deterministically with NO code execution.
    require_archival_pin: true
    require_checksum_when_available: true   # false: archival pin alone grants, unverified bytes
    # Only ARCHIVAL persistent IDs grant the badge. A bare GitHub commit SHA is
    # reproducibly pinned but NOT archival (GitHub is not an archival repo), so
    # it yields a "candidate — deposit in Zenodo/Software Heritage" result.
    archival_pin_kinds: [version_doi, swhid]

  functional:
    # candidate is a HARD invariant: any other value is clamped back to
    # candidate and called out in the report notes (never silently honored).
    mode: candidate
    require_primary_pass: true        # all primary steps status=pass (false: >=1 pass suffices, noted)
    require_expected_output: true     # >= 1 declared expected_output produced (false: relaxed, noted)

  results_reproduced:
    mode: not-evaluated               # never proposed automatically; a human judges reproduction
    # Evidence the report shows that human: every committed output the run
    # regenerated, compared with the authors' copy (src/reprobe/compare.py).
    # Floats match within numpy.isclose(rtol, atol); integers must match exactly. atol is
    # tiny on purpose: it only absorbs noise around ZERO (a residual of 1e-16). A larger
    # one makes every small value equal — p = 1e-10 and p = 9e-10 differ ninefold.
    # A "differs" can be nondeterminism (unseeded RNG, library drift), so it is a
    # finding to review — not a verdict, and never a badge decision.
    rtol: 1.0e-6
    atol: 1.0e-12
    max_bytes: 50000000               # per file; larger files are listed, not read
    max_files: 200

fair:
  findable:
    require_persistent_id: true       # persistent = acm.available.archival_pin_kinds (one knob, no drift)
  accessible:
    require_open_or_documented_access: true
    # Resolver types that imply open (or documented) access. Adding a fetcher?
    # Add its resolved_type here — no code change needed.
    open_access_types: [zenodo, git, osf, figshare, dryad, dataverse, software_heritage, local]
  interoperable:
    prefer_standard_formats: [csv, json, parquet, png, pdf, ipynb]
  reusable:
    reward_manifest: true              # .reprobe.yaml — the artifact declares how to run itself
    reward_open_license: true          # fetcher metadata OR a root LICENSE/COPYING file
    reward_dependency_manifest: true   # requirements.txt / environment.yml / renv.lock / DESCRIPTION / ...
