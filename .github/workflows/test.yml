# Deterministic unit suite — Docker-daemon-free and offline by design,
# so it runs on stock GitHub runners with no services.
name: test

on:
  # A branch in this repo with an open PR fires BOTH events, so every job ran
  # twice on every push — six check runs for three jobs. Scope push to the trunk
  # (the thing that must never go red) and let pull_request cover branches. The
  # trade-off is deliberate: a branch pushed with no PR open gets no CI, which is
  # the point at which nobody is waiting on the answer.
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  # Separate job, not a step: a lint failure and a test failure are different
  # news, and one must not hide the other behind a single red X.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src/ tests/
