# The unit and lint jobs need no Docker daemon and no network, so they run on
# stock GitHub runners with no services. Tests that start real containers are
# marked `docker`, are deselected from the default suite (pyproject addopts),
# and run only in the separate `sandbox` job below.
name: test

on:
  # A branch in this repo with an open PR fires BOTH events, so every job ran
  # twice on every push — six check runs for three jobs. Scope push to the trunk
  # (the thing that must never go red) and let pull_request cover branches. The
  # trade-off is deliberate: a branch pushed with no PR open gets no CI, which is
  # the point at which nobody is waiting on the answer.
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The optional extras are installed so their tests run for real in CI: the
      # PDF parser (paper) and the Software Heritage verifier (swh) are checked
      # against the actual libraries, and skip silently on a bare install.
      - name: Install
        run: pip install -e ".[dev,paper,swh]"
      - name: Test
        run: python -m pytest -q

  # Separate job, not a step: a lint failure and a test failure are different
  # news, and one must not hide the other behind a single red X.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src/ tests/

  # The unit suite checks the argv build_argv produces, which shows the flags
  # are REQUESTED. This job runs real containers on the runner's own Docker
  # daemon and checks from inside them that the flags HOLD: uid, capabilities,
  # seccomp, no network, read-only rootfs, cgroup caps, timeout kill. It is a
  # separate job because it needs a daemon and pulls an image from Docker Hub,
  # and a red result here means something different from a unit failure.
  sandbox:
    runs-on: ubuntu-latest
    # Each probe finishes in seconds. A hung daemon should fail the job, not
    # hold a runner for the default six hours.
    timeout-minutes: 15
    env:
      # Without a daemon the sandbox tests skip, which is fine on a laptop. Here
      # a skip would be a silent green, so this makes it a failure.
      REPROBE_REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]"
      # Prints client and server versions into the log, and fails here (not
      # deep inside a test) if the daemon is not running.
      - name: Docker daemon
        run: docker version
      - name: Sandbox tests
        run: python -m pytest -m docker tests/sandbox -v
