# Add the packages a base image's env.yaml newly declares to its conda-lock.yml,
# holding every package already locked at its exact version and build
# (images/lock-add.py). The lock is uploaded as an artifact to review and
# commit; nothing is pushed or published. Then run build-base-images.
name: lock-base-images

on:
  workflow_dispatch:
    inputs:
      which:
        description: "which image: py | r"
        required: true

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install "conda-lock==4.0.3" pyyaml
      - name: Lock
        env:
          WHICH: ${{ inputs.which }}
        run: |
          case "$WHICH" in py|r) ;; *) echo "::error::which must be py or r"; exit 1;; esac
          python images/lock-add.py "images/base-$WHICH"
      - uses: actions/upload-artifact@v7
        with:
          name: conda-lock-base-${{ inputs.which }}
          path: images/base-${{ inputs.which }}/conda-lock.yml
          if-no-files-found: error
