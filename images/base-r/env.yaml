# AutoUI-typical R stack, governed by the same micromamba solver as base-py.
name: base
channels: [conda-forge]
dependencies:
  - r-base=4.4.*
  - r-tidyverse
  - r-rmarkdown
  - r-knitr
  - r-renv
  - r-irkernel
  - r-data.table
  - r-lme4
  # AutoUI-typical stats + reporting stack. Preinstalled from conda-forge as
  # ABI-matched BINARIES (with their system libs) so reprobe's runtime CRAN
  # install doesn't have to compile these heavy, system-dependency-laden trees —
  # in particular the ggstatsplot/car/afex/PMCMRplus tree and the font-rendering
  # stack (systemfonts/ragg), which are painful to build from source under conda.
  # (ARTool / equatiomatic / reporttools are not on conda-forge; they are pure-R
  #  CRAN packages that reprobe compiles at runtime — their heavy deps come from
  #  the conda binaries below.)
  - r-ggstatsplot
  - r-afex
  - r-car
  - r-effectsize
  - r-report
  - r-performance
  - r-patchwork
  - r-ggsignif
  - r-stargazer
  - r-wesanderson
  - r-xtable
  - r-rstudioapi
  - r-readxl
  - r-rstatix        # required at runtime by colleyRstats::checkAssumptionsForAnova()
  # Compiler toolchain + build tools (ABI-matched to conda's R) so CRAN source
  # packages that DO need compiling — Rcpp*, gmp, later, etc. — build. Without
  # these, install.packages() of any compiled package fails; the pinned-base
  # install phase (and reprobe's auto-CRAN install) can only do pure-R packages.
  - c-compiler
  - cxx-compiler
  - fortran-compiler
  - make
  - cmake
  - pkg-config
  - gmp
  - mpfr
  - zlib
  - bzip2
  - xz
  - pandoc
