# AutoUI-typical R stack, governed by the same micromamba solver as base-py.
name: base
channels: [conda-forge]
dependencies:
  - r-base=4.4.*
  - r-tidyverse
  - r-rmarkdown
  - r-knitr
  - r-renv
  - r-irkernel
  - r-data.table
  - r-lme4
  # Compiler toolchain (ABI-matched to conda's R) so CRAN source packages that
  # need C/C++/Fortran — Rcpp*, gmp, later, etc. — actually build. Without these,
  # install.packages() of any compiled package fails; the pinned-base install
  # phase (and reprobe's auto-CRAN install) can then only handle pure-R packages.
  - c-compiler
  - cxx-compiler
  - fortran-compiler
  - make
  - pandoc
