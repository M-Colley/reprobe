# AutoUI-typical Python data-science stack. Edit this + re-run images/build-images.sh
# only when the science stack must move; it then re-solves conda-lock.yml so the
# base image is reproducible from the lock alone.
name: base
channels: [conda-forge]
dependencies:
  - python=3.13
  - pip
  - jupyter
  - nbconvert
  - ipykernel
  - papermill
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - statsmodels
  - matplotlib
  - seaborn
  - xgboost
  - catboost
  - lightgbm
  - shap
  - optuna
  # ---- dataset readers -------------------------------------------------- #
  # INVARIANT: every extension in detect/signatures.py:_NONCODE_TYPES["dataset"]
  # must be openable from this image. reprobe's detector advertises those formats
  # as recognized data; shipping a pandas that cannot read them made real
  # artifacts fail with ImportError and get scored as broken code. Enforced by
  # tests/unit/test_base_image_readers.py — add the reader here when you add an
  # extension there.
  - pyarrow          # parquet, feather, arrow
  - openpyxl         # xlsx
  - xlrd             # xls (legacy)
  - pytables         # h5, hdf5  (pandas HDFStore)
  - netcdf4          # nc
  - pyreadstat       # sav (SPSS), and faster dta (Stata)
