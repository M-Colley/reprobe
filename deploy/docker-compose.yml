# Local stack: the Ollama sidecar (Gemma 4 (e4b)) on a private network.
# The harness CLI runs on the host and talks to Ollama at 127.0.0.1:11434.
# Bring up only the LLM:  docker compose -f deploy/docker-compose.yml up -d ollama
#
# REPROBE_OLLAMA_IMAGE / REPROBE_LLM_MODEL override the defaults below; the
# defaults MUST stay in sync with config/pins.yaml (llm.ollama_image / llm.model).
services:
  ollama:
    image: ${REPROBE_OLLAMA_IMAGE:-ollama/ollama:0.12.5}
    container_name: reprobe-ollama
    ports:
      - "127.0.0.1:11434:11434"      # bind to loopback only
    volumes:
      - ollama-models:/root/.ollama
    networks: [reprobe]
    healthcheck:                     # model-pull waits on this, not just container start
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 10s
      retries: 12
    # GPU is optional; uncomment for NVIDIA acceleration:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

  # one-shot: pull the model once `ollama` is healthy.
  # The fallback default must match pins.yaml llm.model.
  model-pull:
    image: ${REPROBE_OLLAMA_IMAGE:-ollama/ollama:0.12.5}
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - REPROBE_LLM_MODEL            # passed through from the host if set
    entrypoint: ["/bin/sh", "-c", "OLLAMA_HOST=ollama:11434 ollama pull \"$${REPROBE_LLM_MODEL:-gemma4:e4b}\""]
    networks: [reprobe]
    restart: "no"

volumes:
  ollama-models:

networks:
  reprobe:
    driver: bridge
