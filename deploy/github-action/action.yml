name: "reprobe check"
description: "Fetch, sandbox-run, and report on a research artifact (AutoUI open data)."
inputs:
  submission:
    description: "git URL, Zenodo DOI/record, anonymous.4open.science link, or path"
    required: true
  llm:
    description: "enable the local LLM advisory (true/false)"
    required: false
    default: "false"
  args:
    description: "extra args passed to `reprobe run`"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with: { python-version: "3.13" }
    - name: Install reprobe
      shell: bash
      # Install from the action's own checkout (repo root is two levels up),
      # NEVER from the caller's workspace — that may hold an untrusted submission.
      run: pip install "$GITHUB_ACTION_PATH/../.."
    - name: Point reprobe at the action's config
      shell: bash
      # A non-editable pip install carries no config/; resolve it from the
      # action's own checkout — never from the caller's (untrusted) workspace.
      run: echo "REPROBE_CONFIG_DIR=$GITHUB_ACTION_PATH/../../config" >> "$GITHUB_ENV"
    - name: Pull pinned images
      shell: bash
      # Stock runners have no reprobe images; doctor hard-fails without them.
      run: reprobe pull
    - name: Doctor
      shell: bash
      run: reprobe doctor
    - name: Run
      shell: bash
      # Inputs arrive through env, never as ${{ }} inside the script: Actions
      # expands those into the script TEXT before bash parses it, so a
      # submission URL taken from an issue or PR could inject shell. `read -a`
      # splits args on whitespace without glob or command expansion.
      env:
        REPROBE_SUBMISSION: ${{ inputs.submission }}
        REPROBE_LLM: ${{ inputs.llm }}
        REPROBE_ARGS: ${{ inputs.args }}
      run: |
        read -r -a extra <<< "$REPROBE_ARGS"
        [ "$REPROBE_LLM" = "true" ] || extra+=(--no-llm)
        # The work dir lives outside the workspace: `submission: .` would
        # otherwise put it inside the tree being checked.
        reprobe run "$REPROBE_SUBMISSION" --workroot "$RUNNER_TEMP/reprobe-work" "${extra[@]}"
    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: reprobe-report
        # Reports land in <workroot>/<submission>/report/ (report.json/.md/.html
        # and collected artifacts). A missing report is a failure, not a warning.
        path: ${{ runner.temp }}/reprobe-work/*/report/
        if-no-files-found: error
# Note: the host runner must have Docker available (the action launches sibling
# sandboxed containers). For batch matrices, drive `reprobe batch` instead.
