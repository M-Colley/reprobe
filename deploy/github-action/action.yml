name: "reprobe check"
description: "Fetch, sandbox-run, and report on a research artifact (AutoUI open data)."
inputs:
  submission:
    description: "git URL, Zenodo DOI/record, anonymous.4open.science link, or path"
    required: true
  tiers:
    description: "comma list, e.g. structural,compile (Unity tiers need a Unity seat)"
    required: false
    default: "structural"
  llm:
    description: "enable the local LLM advisory (true/false)"
    required: false
    default: "false"
  args:
    description: "extra args passed to `reprobe run`"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with: { python-version: "3.13" }
    - name: Install reprobe
      shell: bash
      # Install from the action's own checkout (repo root is two levels up),
      # NEVER from the caller's workspace — that may hold an untrusted submission.
      run: pip install "$GITHUB_ACTION_PATH/../.."
    - name: Pull pinned base images
      shell: bash
      # Stock runners have no reprobe images; doctor hard-fails without them.
      # Read the tags from the action's own pins.yaml so this never drifts.
      run: |
        python -c "import yaml,sys; b=yaml.safe_load(open(sys.argv[1]))['base_images']; print(b['python']); print(b['r'])" \
          "$GITHUB_ACTION_PATH/../../config/pins.yaml" | xargs -rn1 docker pull
    - name: Doctor
      shell: bash
      run: reprobe doctor
    - name: Run
      shell: bash
      run: |
        LLM_FLAG=""
        [ "${{ inputs.llm }}" = "true" ] || LLM_FLAG="--no-llm"
        reprobe run "${{ inputs.submission }}" $LLM_FLAG ${{ inputs.args }}
    - name: Upload report
      uses: actions/upload-artifact@v4
      with:
        name: reprobe-report
        path: work/*/out/
# Note: the host runner must have Docker available (the action launches sibling
# sandboxed containers). For batch matrices, drive `reprobe batch` instead.
