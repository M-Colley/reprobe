[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reprobe"
version = "0.3.0"
description = "Reusable artifact-reproducibility harness for AutoUI open data — URL in, runnable check out."
readme = "README.md"
# 3.11.4 is where tarfile gained the `data` extraction filter, which is now the
# only containment for untrusted archive members (no hand-written fallback).
requires-python = ">=3.11.4"
license = { text = "MIT" }
authors = [{ name = "AutoUI Open Data" }]
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "requests>=2.28",
    "typer>=0.9",
    "rich>=13.0",
    "jsonschema>=4",
    # Parses the artifact's requirements.txt (PEP 508) so the install phase can drop
    # editable/VCS/URL lines instead of a hand-written regex deciding what is safe.
    "packaging>=23.0",
    # Comparing regenerated outputs against the committed ones (compare.py):
    # tolerance-aware tabular comparison is what pandas/numpy exist for.
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6"]
# Text extraction from a paper PDF committed in a repo, for the advisory
# results-vs-paper comparison. Optional: without it the DOI path still works and
# the report says the PDF was not read (never that it matched).
# pypdf >= 6.14: earlier 6.x/5.x releases have 2026 advisories for infinite loops
# and memory exhaustion on crafted PDFs. Parsing also runs in a time-boxed child
# process (paper.pdf_text), so a future one costs a warning, not a batch.
paper = ["pypdf>=6.14"]
# Verify a Software Heritage deposit: re-hash the fetched tree with the reference
# implementation and compare it to the SWHID. Without it an SWHID pin is recorded
# but never counts as checksum-verified, so Available stays a candidate.
swh = ["swh.model>=8.0"]
# Compare regenerated .parquet outputs. >= 14.0.1: earlier pyarrow can run code
# embedded in an untrusted Parquet file (CVE-2023-47248), and compare.py refuses it.
parquet = ["pyarrow>=14.0.1"]

[project.scripts]
reprobe = "reprobe.cli:main"

# Built-in runners are also registered here so third parties can ship runners
# as separate pip packages (Julia, MATLAB, Node/Playwright) with zero core edits.
[project.entry-points."reprobe.runners"]
python = "reprobe.runners.python_script:PythonScriptRunner"
jupyter = "reprobe.runners.jupyter:JupyterRunner"
r = "reprobe.runners.r_script:RScriptRunner"
rmarkdown = "reprobe.runners.rmarkdown:RMarkdownRunner"
unity = "reprobe.runners.unity:UnityRunner"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# schemas/*.json MUST ship in the wheel: the manifest validator loads
# autoui-repro.schema.json via importlib.resources, so a non-editable install
# that omitted it would silently skip schema validation of untrusted manifests.
reprobe = ["py.typed", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default suite stays daemon-free and offline. Tests that launch real
# containers carry @pytest.mark.docker and run in their own CI job with
# `pytest -m docker` (a later -m on the command line replaces this one).
addopts = "-m 'not docker'"
markers = ["docker: launches real containers; needs a running Docker daemon"]

# ============================================================================
#  Lint gate. Deliberately narrow: the rules here are the ones that find BUGS,
#  not the ones that have an opinion about style. Adopting the full default set
#  would have meant 200+ findings, nearly all of them `Optional[X]` vs `X | None`
#  and prose em-dashes — noise that trains everyone to ignore the gate.
#
#  What this set has already caught: a dead function, an unresolvable annotation
#  (`zipfile` was never imported, and only `from __future__ import annotations`
#  kept it from being a NameError), and unused imports.
# ============================================================================
[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9", "I", "B"]
ignore = [
    "B008",   # typer REQUIRES calls in defaults: `x: str = typer.Option(...)`
    "B904",   # `raise X from e` — fetchers embed the cause in the message instead
    "B007",   # unused loop variable; the loop shape documents the iteration
]

[tool.ruff.lint.per-file-ignores]
# Tests import mid-file on purpose, to keep a fixture next to what it exercises.
"tests/*" = ["E402"]
