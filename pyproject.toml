[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reprobe"
version = "0.3.0"
description = "Reusable artifact-reproducibility harness for AutoUI open data — URL in, runnable check out."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AutoUI Open Data" }]
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "requests>=2.28",
    "typer>=0.9",
    "rich>=13.0",
    "jsonschema>=4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6"]
# Text extraction from a paper PDF committed in a repo, for the advisory
# results-vs-paper comparison. Optional: without it the DOI path still works and
# the report says the PDF was not read (never that it matched).
paper = ["pypdf>=4.0"]

[project.scripts]
reprobe = "reprobe.cli:main"

# Built-in runners are also registered here so third parties can ship runners
# as separate pip packages (Julia, MATLAB, Node/Playwright) with zero core edits.
[project.entry-points."reprobe.runners"]
python = "reprobe.runners.python_script:PythonScriptRunner"
jupyter = "reprobe.runners.jupyter:JupyterRunner"
r = "reprobe.runners.r_script:RScriptRunner"
rmarkdown = "reprobe.runners.rmarkdown:RMarkdownRunner"
unity = "reprobe.runners.unity:UnityRunner"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# schemas/*.json MUST ship in the wheel: the manifest validator loads
# autoui-repro.schema.json via importlib.resources, so a non-editable install
# that omitted it would silently skip schema validation of untrusted manifests.
reprobe = ["py.typed", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# ============================================================================
#  Lint gate. Deliberately narrow: the rules here are the ones that find BUGS,
#  not the ones that have an opinion about style. Adopting the full default set
#  would have meant 200+ findings, nearly all of them `Optional[X]` vs `X | None`
#  and prose em-dashes — noise that trains everyone to ignore the gate.
#
#  What this set has already caught: a dead function, an unresolvable annotation
#  (`zipfile` was never imported, and only `from __future__ import annotations`
#  kept it from being a NameError), and unused imports.
# ============================================================================
[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9", "I", "B"]
ignore = [
    "B008",   # typer REQUIRES calls in defaults: `x: str = typer.Option(...)`
    "B904",   # `raise X from e` — fetchers embed the cause in the message instead
    "B007",   # unused loop variable; the loop shape documents the iteration
]

[tool.ruff.lint.per-file-ignores]
# Tests import mid-file on purpose, to keep a fixture next to what it exercises.
"tests/*" = ["E402"]
